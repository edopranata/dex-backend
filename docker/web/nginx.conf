server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Resolve the app container at request time via Docker DNS: containers get a new IP when they are
    # recreated on deploy, and a name resolved only at startup would keep pointing at the old one (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    client_max_body_size 4m;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite assets have content hashes in their names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # PWA: the service worker, its manifest and the app shell must never be cached (Cloudflare caches
    # static files for hours otherwise), or "versi baru tersedia" would show up hours after a deploy.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Static files from public/, everything else (API and Vue routes) through Laravel.
    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
